<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية خالد للميكرومعلوماتية</title>
    <style>
        :root {
            --primary: #5ce1e6;
            --bg-dark: #0f172a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 20px;
            /* حماية عملك: منع تحديد النصوص ومنع النسخ */
            -webkit-user-select: none;
            user-select: none;
        }
        .header { text-align: center; padding: 40px; }
        .profile-img {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid var(--primary); object-fit: cover;
        }
        h1 { color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .insta-link {
            display: inline-block; color: var(--primary); text-decoration: none;
            border: 1px solid var(--primary); padding: 8px 20px; border-radius: 25px; margin-top: 10px;
        }
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; max-width: 1000px; margin: 40px auto;
        }
        .card {
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px;
            text-align: center; text-decoration: none; color: white; border: 1px solid transparent;
        }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); transition: 0.3s; }
        
        /* تنسيق الحقوق المحفوظة أسفل الصفحة */
        footer {
            text-align: center; padding: 40px 20px; margin-top: 60px;
            border-top: 1px solid rgba(255,255,255,0.1); color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="me.png" class="profile-img" alt="خالد">
        <h1>أكاديمية خالد للميكرومعلوماتية <span style="color: #1DA1F2;">✔</span></h1>
        <p>احتراف البرمجيات المكتبية بكل سهولة</p>
        <a href="https://www.instagram.com/volkov.shadow?igsh=MTIybGpjMmdsdHVpdA==" target="_blank" class="insta-link">
            📷 @volkov.shadow
        </a>
    </div>

    <div class="grid-container">
        <a href="intro.html" class="card"><h3>⚙️ الميكرومعلوماتية</h3></a>
        <a href="word.html" class="card"><h3>📄 Microsoft Word</h3></a>
        <a href="excel.html" class="card"><h3>📊 Microsoft Excel</h3></a>
        <a href="powerpoint.html" class="card"><h3>🎭 PowerPoint</h3></a>
        <a href="shortcuts.html" class="card">
    <h3>⌨️ اختصارات لوحة المفاتيح</h3>
</a>

<a href="ai-assistant.html" class="card">
    <h3>🤖 مساعد خالد الذكي</h3>

    </div>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة - أكاديمية خالد للميكرومعلوماتية</p>
    </footer>

</body>
</html>
