<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد خالد الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 15px; line-height: 1.6; }
        .user-message { align-self: flex-start; background-color: #007bff; color: white; border-bottom-left-radius: 2px; }
        .bot-message { align-self: flex-end; background-color: #e9ecef; color: #333; border-bottom-right-radius: 2px; }
        .input-area { background: white; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        button { padding: 10px 25px; background: #007bff; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .loading { font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #333;">🤖 مساعد خالد الذكي</h2>

    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">أهلاً بك في أكاديمية خالد! كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // إضافة رسالة المستخدم للواجهة
            appendMessage(text, 'user-message');
            userInput.value = '';

            // إضافة رسالة انتظار
            const loadingId = 'loading-' + Date.now();
            appendMessage('جاري التفكير...', 'bot-message', loadingId);

            try {
                // الاتصال بسيرفر Netlify اللي خدمناه (بدون الحاجة لمفتاح هنا)
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;

                // استبدال رسالة الانتظار برد الذكاء الاصطناعي
                document.getElementById(loadingId).innerText = aiResponse;
            } catch (error) {
                document.getElementById(loadingId).innerText = "عذراً، حدث خطأ في الاتصال بالسيرفر.";
                console.error(error);
            }
        }

        function appendMessage(text, className, id = '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // إرسال بالضغط على Enter
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
