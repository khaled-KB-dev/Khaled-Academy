<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد أكاديمية باينو خالد</title>
    <style>
        /* التنسيق الداكن الاحترافي مثل صورتك */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0a192f; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }
        .chat-container { 
            width: 480px; max-width: 95%; height: 90vh;
            background: #112240; border-radius: 15px; 
            display: flex; flex-direction: column; 
            border: 1px solid #233554; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .chat-header { 
            padding: 20px; text-align: center; color: #64ffda; 
            font-weight: bold; font-size: 1.3em; border-bottom: 1px solid #233554; 
        }
        #chat-window { 
            flex: 1; padding: 20px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 15px; background: #0a192f;
        }
        .message { padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.6; max-width: 85%; }
        /* رسالة المستخدم - زرقاء داكنة */
        .user-msg { background: #233554; color: #ccd6f6; align-self: flex-start; border-bottom-right-radius: 2px; }
        /* رسالة البوت - تركواز فاتح مريح */
        .ai-msg { background: #112240; color: #81e6d9; align-self: flex-end; border: 1px solid #233554; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 15px; background: #112240; border-top: 1px solid #233554; }
        input { 
            flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #233554;
            background: #0a192f; color: #ccd6f6; outline: none; font-size: 15px;
        }
        input:focus { border-color: #64ffda; }
        button { 
            background: #64ffda; color: #0a192f; border: none; 
            padding: 10px 25px; border-radius: 25px; margin-right: 10px; 
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #a8fff3; }
        /* ستايل السكرول بار */
        #chat-window::-webkit-scrollbar { width: 5px; }
        #chat-window::-webkit-scrollbar-thumb { background: #233554; border-radius: 10px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 مساعد أكاديمية خالد الذكي</div>
    <div id="chat-window">
        <div class="message ai-msg">مرحباً بك ايها الطالب في أكاديمية المطور باينو خالد! أنا مساعدك الذكي المطور خصيصاً لك. كيف أساعدك اليوم؟ ✨</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="اسأل المساعد..." autocomplete="off">
        <button id="send-btn">إرسال</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. عرض رسالة المستخدم
        addMessage(text, 'user-msg');
        const userQuery = text.toLowerCase();
        userInput.value = "جاري التفكير...";
        chatWindow.scrollTop = chatWindow.scrollHeight;

        // 2. فحص الهوية (قبل الاتصال بالإنترنت)
        const creatorKeywords = ["من صنعك", "من صممك", "من طورك", "من مبرمجك", "من أنت", "من انت", "شكون خدمك", "شكون صممك", "خالد", "صاحب الموقع"];
        
        if (creatorKeywords.some(key => userQuery.includes(key))) {
            setTimeout(() => {
                addMessage("تم تطويري وتصميمي بالكامل بواسطة المبدع <b>المطور خالد KB</b>، صاحب أكاديمية خالد. أنا فخور لكوني جزءاً من هذا المشروع الجزائري! 🚀🇩🇿", 'ai-msg');
                userInput.value = "";
            }, 600);
            return; 
        }

        // 3. الاتصال بالذكاء الاصطناعي للأسئلة العامة
        try {
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai&arabic=true`);
            const aiReply = await response.text();
            addMessage(aiReply, 'ai-msg');
        } catch (error) {
            addMessage("⚠️ عذراً، حدث خطأ في الاتصال. حاول مرة أخرى.", 'ai-msg');
        }

        userInput.value = "";
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text; // استخدمنا innerHTML ليدعم الـ bold
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
<script>
    // 1. منع القائمة اليمنى (Right Click)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        showToast("⚠️ عذراً.. حقوق الكود محفوظة لأكاديمية خالد KB");
    });

    // 2. منع اختصارات لوحة المفاتيح (F12, Ctrl+U, Ctrl+Shift+I)
    document.onkeydown = function(e) {
        // منع F12
        if (event.keyCode == 123) { return false; }
        
        // منع Ctrl+Shift+I (المطورين)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
        
        // منع Ctrl+Shift+J (المطورين)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
        
        // منع Ctrl+U (عرض كود المصدر)
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }

        // منع Ctrl+S (حفظ الصفحة)
        if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) { return false; }
    };

    // 3. منع تصوير الشاشة أو السحب (اختياري)
    document.styleSheets[0].insertRule('body { user-select: none; -webkit-user-select: none; }', 0);
</script>
</body>
</html>
